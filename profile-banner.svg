    <text x="545" y="90">def predict(data):</text>
    <text x="545" y="126">    model = load_model()</text>
    <text x="545" y="162">    return model.predict(data)</text>
    <text x="545" y="230">class AIModel:</text>
    <text x="545" y="266">    def __init__(self):</text>
    <text x="545" y="302">        self.model = None</text>
    <text x="545" y="372">from fastapi import FastAPI</text>
    <text x="545" y="408">app = FastAPI()</text>
    <text x="545" y="444">@app.get("/")</text>
    <text x="545" y="480">def read_root():</text>
    <text x="545" y="516">    return {"message": "Hello"}</text>
    <text x="545" y="554"># RAG</text>
    <text x="545" y="590">def retrieve(queries):</text>
