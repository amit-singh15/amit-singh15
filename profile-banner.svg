    <text x="560" y="405">app = FastAPI()</text>
    <text x="560" y="440">@app.get("/")</text>
    <text x="560" y="475">def read_root():</text>
    <text x="560" y="510">    return {"message": "Hello"}</text>
    <text x="560" y="560"># RAG</text>
    <text x="560" y="595">def retrieve(queries):</text>
